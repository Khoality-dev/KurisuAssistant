<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Character</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #message { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; margin: 0; padding: 16px; text-align: center; color: #666; font-size: 15px; }
      #subtitle { position: fixed; left: 12px; right: 12px; bottom: 16px; margin: 0; padding: 8px 12px; border-radius: 8px; text-align: center; font-size: 15px; line-height: 1.35; color: #fff; background: rgba(0, 0, 0, 0.6); }
      #subtitle.user { background: rgba(25, 118, 210, 0.75); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <p id="message" hidden></p>
    <p id="subtitle" hidden></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
