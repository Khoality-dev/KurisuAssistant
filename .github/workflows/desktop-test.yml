name: Desktop – E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'clients/desktop/**'
      - '.github/workflows/desktop-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'clients/desktop/**'
      - '.github/workflows/desktop-test.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: clients/desktop

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + Electron main
        run: npm run test:e2e:build

      - name: Run Playwright tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: Run Playwright tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.os }}
          path: |
            clients/desktop/test-results/
            clients/desktop/playwright-report/
          retention-days: 7
