name: Desktop – Tests

on:
  push:
    branches: [main]
    paths:
      - 'clients/apps/desktop/**'
      # The shared packages are this app's own code now, so a change to them
      # has to run this suite (#128).
      - 'clients/packages/**'
      - 'clients/package.json'
      - 'clients/package-lock.json'
      # The protocol manifest is shared: a change to it has to run this
      # suite too, or the drift check only fires for whoever edited last (#93).
      - 'protocol/**'
      # The Android character page is built from clients/packages/vrm; a hand
      # edit of the committed file must fail the drift step too (#245).
      - 'clients/android/app/src/main/assets/character/**'
      - '.github/workflows/desktop-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'clients/apps/desktop/**'
      # The shared packages are this app's own code now, so a change to them
      # has to run this suite (#128).
      - 'clients/packages/**'
      - 'clients/package.json'
      - 'clients/package-lock.json'
      # The protocol manifest is shared: a change to it has to run this
      # suite too, or the drift check only fires for whoever edited last (#93).
      - 'protocol/**'
      # The Android character page is built from clients/packages/vrm; a hand
      # edit of the committed file must fail the drift step too (#245).
      - 'clients/android/app/src/main/assets/character/**'
      - '.github/workflows/desktop-test.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: clients/apps/desktop

jobs:
  # Typecheck and unit tests were both missing. The release path builds with
  # `vite build` alone, which does not typecheck, so type errors could ship in a
  # strict-mode codebase; and `npm test` (vitest) was never run anywhere.
  # Neither depends on the OS, so one Linux job covers both and fails fast
  # before the slower Electron matrix starts.
  #
  # Both run from the workspace root, not from the app: the root scripts fan
  # out to every member, and the shared packages are where the boundary test
  # and the protocol drift test live. Run from `clients/apps/desktop` they
  # covered that app alone, and no package test had ever run in CI (#225).
  checks:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/package-lock.json

      - name: Install dependencies
        # The workspace root owns the lockfile and every member's dependencies
        # hoist into it, so this is the only directory `npm ci` can run in.
        working-directory: clients
        run: npm ci
        env:
          # @vscode/ripgrep downloads a prebuilt binary from the GitHub API in a
          # postinstall hook. Unauthenticated calls are rate-limited per runner
          # IP, so this intermittently fails the whole job with a 403 before any
          # test runs. The token raises the limit; it needs no extra scope.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        working-directory: clients
        run: npm run typecheck

      - name: Unit tests
        working-directory: clients
        run: npm test

      # Android ships the character page as a committed file, because its build
      # and release have no JavaScript toolchain (#245). Rebuild it from source
      # and fail if the committed file is not exactly what the source builds —
      # a hand edit, or a renderer change nobody rebuilt.
      - name: Character page matches its source
        working-directory: clients
        run: |
          npm run build:page -w @kurisu/vrm
          dir=android/app/src/main/assets/character
          if ! git diff --quiet -- "$dir" || [ -n "$(git ls-files --others --exclude-standard -- "$dir")" ]; then
            git status --short -- "$dir"
            echo "::error::android/app/src/main/assets/character is not what 'npm run build:page -w @kurisu/vrm' builds. Rebuild it and commit the result."
            exit 1
          fi

  e2e:
    name: Playwright end-to-end
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/package-lock.json

      - name: Install dependencies
        # The workspace root owns the lockfile and every member's dependencies
        # hoist into it, so this is the only directory `npm ci` can run in.
        working-directory: clients
        run: npm ci
        env:
          # @vscode/ripgrep downloads a prebuilt binary from the GitHub API in a
          # postinstall hook. Unauthenticated calls are rate-limited per runner
          # IP, so this intermittently fails the whole job with a 403 before any
          # test runs. The token raises the limit; it needs no extra scope.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build renderer + Electron main
        run: npm run test:e2e:build

      - name: Run Playwright tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: Run Playwright tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.os }}
          path: |
            clients/apps/desktop/test-results/
            clients/apps/desktop/playwright-report/
          retention-days: 7
