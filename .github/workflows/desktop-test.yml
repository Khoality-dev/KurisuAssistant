name: Desktop – Tests

on:
  push:
    branches: [main]
    paths:
      - 'clients/desktop/**'
      - '.github/workflows/desktop-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'clients/desktop/**'
      - '.github/workflows/desktop-test.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: clients/desktop

jobs:
  # Typecheck and unit tests were both missing. The release path builds with
  # `vite build` alone, which does not typecheck, so type errors could ship in a
  # strict-mode codebase; and `npm test` (vitest) was never run anywhere.
  # Neither depends on the OS, so one Linux job covers both and fails fast
  # before the slower Electron matrix starts.
  checks:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          # @vscode/ripgrep downloads a prebuilt binary from the GitHub API in a
          # postinstall hook. Unauthenticated calls are rate-limited per runner
          # IP, so this intermittently fails the whole job with a 403 before any
          # test runs. The token raises the limit; it needs no extra scope.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  e2e:
    name: Playwright end-to-end
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          # @vscode/ripgrep downloads a prebuilt binary from the GitHub API in a
          # postinstall hook. Unauthenticated calls are rate-limited per runner
          # IP, so this intermittently fails the whole job with a 403 before any
          # test runs. The token raises the limit; it needs no extra scope.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build renderer + Electron main
        run: npm run test:e2e:build

      - name: Run Playwright tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: Run Playwright tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.os }}
          path: |
            clients/desktop/test-results/
            clients/desktop/playwright-report/
          retention-days: 7
