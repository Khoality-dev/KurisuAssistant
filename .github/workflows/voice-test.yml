# Voice – unit tests
#
# The speech service (voice/) had no CI in its own repository, and the backend's
# suite only ever talks to a fake of it. This runs the service's own tests: the
# HTTP surface the backend's proxies depend on, driven against fakes so nothing
# pulls a model.
#
# voice/requirements-ci.txt, not requirements.txt: the latter targets the CUDA
# PyTorch image and is gigabytes the tests never reach. Every heavy import in
# the package is inside the function that uses it, which is what keeps this
# runnable on a bare runner — see the header of that file.

name: Voice – Tests

on:
  push:
    branches: [main]
    paths:
      - 'voice/**'
      - '.github/workflows/voice-test.yml'
  pull_request:
    paths:
      - 'voice/**'
      - '.github/workflows/voice-test.yml'
  workflow_dispatch:

concurrency:
  group: voice-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: voice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: voice/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run tests
        run: python -m pytest tests -q
