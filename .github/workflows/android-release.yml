name: Android – Build and Release

# Release flow for the Android client:
#
#   1. Bump versionCode / versionName in clients/android/app/build.gradle.kts and commit.
#   2. git tag android-v<versionName> && git push origin android-v<versionName>
#
# Builds the signed prod release APK and publishes it as the release
# `android-v<versionName>` on this repository (#229). The app's in-app updater
# (UpdateRepository) lists this repository's releases and takes the newest
# `android-v*` one. The release is marked a pre-release on purpose: the desktop
# client's electron-updater can only read `releases/latest`, which GitHub
# defines as the newest release that is not a pre-release, so that slot has to
# stay the desktop's. It says nothing about the APK's maturity.
#
# Required secrets (two — #229):
#   KURISU_KEYSTORE_BASE64   — release keystore, base64-encoded
#   KURISU_KEYSTORE_PASSWORD — its password; the key inside uses the same one
#                              (a PKCS12 keystore has exactly one), and the key
#                              alias is read from the keystore at build time
#
# A manual run (workflow_dispatch) builds the APK and uploads it as a workflow
# artifact without publishing.

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: write   # the release is created here

defaults:
  run:
    working-directory: clients/android

jobs:
  build:
    runs-on: ubuntu-latest
    # Promote secrets to job-level env so the `if:` conditionals below can read them.
    # Empty string when the secret isn't set — that's how we detect missing config.
    env:
      KURISU_KEYSTORE_BASE64: ${{ secrets.KURISU_KEYSTORE_BASE64 }}
      KURISU_KEYSTORE_PASSWORD: ${{ secrets.KURISU_KEYSTORE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          gradle_version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          echo "version=$gradle_version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            tag_version="${GITHUB_REF_NAME#android-v}"
            if [[ "$tag_version" != "$gradle_version" ]]; then
              echo "Tag version '$tag_version' does not match versionName '$gradle_version' in app/build.gradle.kts" >&2
              exit 1
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Decode the release keystore from the base64 secret. If the secret is
      # missing these two steps are skipped and the build step below FAILS,
      # naming the values it needs — rather than publishing an APK signed with
      # the debug key to the channel real users update from (#100).
      - name: Decode release keystore
        if: env.KURISU_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KURISU_KEYSTORE_BASE64" | base64 -d > kurisu-release.jks

      # The alias is not a secret — it is the name of the one key entry in the
      # keystore — so it is read from the keystore rather than configured. The
      # key password is the store password: a PKCS12 keystore (the Android
      # Studio default) has one password for both, and keytool refuses to set
      # a different one. A JKS whose key has its own password fails at the
      # build step with Gradle's message; convert it (keytool -importkeystore
      # -deststoretype pkcs12) rather than adding a secret.
      - name: Write .env for Gradle
        if: env.KURISU_KEYSTORE_BASE64 != ''
        run: |
          alias="$(keytool -list -keystore kurisu-release.jks -storepass "$KURISU_KEYSTORE_PASSWORD" 2>/dev/null \
            | sed -nE 's/^([^,]+), .*PrivateKeyEntry.*/\1/p' | head -1)"
          if [[ -z "$alias" ]]; then
            echo "No private key entry found in the keystore (wrong password, or not a keystore)" >&2
            exit 1
          fi
          {
            echo "KURISU_KEYSTORE=kurisu-release.jks"
            echo "KURISU_KEYSTORE_PASSWORD=$KURISU_KEYSTORE_PASSWORD"
            echo "KURISU_KEY_ALIAS=$alias"
            echo "KURISU_KEY_PASSWORD=$KURISU_KEYSTORE_PASSWORD"
          } > .env

      - name: Build prod release APK
        run: chmod +x ./gradlew && ./gradlew assembleProdRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: clients/android/app/build/outputs/apk/prod/release/*.apk
          # The APK is also attached to the GitHub Release below, which is free
          # and permanent. This artifact is only for debugging a failed run.
          retention-days: 7

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Android v${{ steps.version.outputs.version }}
          # Keeps releases/latest for the desktop client — see the header.
          prerelease: true
          files: clients/android/app/build/outputs/apk/prod/release/*.apk
