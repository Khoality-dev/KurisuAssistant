# Android – unit tests, and the instrumented end-to-end suite on an emulator
#
# The Android client had no test CI: nine JVM test sources existed and only ever
# ran on a developer's machine, while the release workflow built a signed APK
# without running any of them. The instrumented suite (androidTest/) drives the
# real app against the standalone mock backend and had never run in CI (#310).
#
# Notes that are easy to get wrong here:
#
#  * The task must be flavour-qualified. Two product flavours (prod, dev) times
#    two build types gives four unit-test variants, and the release variants
#    enable minification, so a bare `./gradlew test` builds far more than needed.
#    No test reads BuildConfig or flavour resources, so dev and prod cover the
#    same code; dev matches the documented local command.
#
#  * No signing secrets and no .env. app/build.gradle.kts decodes the keystore at
#    configuration time, so a malformed secret would fail the build before a
#    single test ran. Absent secrets are handled gracefully; wrong ones are not.
#
#  * No configuration cache. The dev flavour shells out to git at configuration
#    time to stamp the version name, which the configuration cache rejects.
#
#  * The instrumented job needs an emulator (KVM on the runner) and the mock
#    backend beside it: one mock process per scenario the suite uses, on
#    15597 + the offset in e2e/MockBackend.kt's SCENARIO_PORT_OFFSETS — keep the
#    list below in step with it. The emulator reaches the runner at 10.0.2.2,
#    which is the dev flavour's default MOCK_BACKEND_URL. API 34: the suite
#    grants POST_NOTIFICATIONS, a runtime permission only from 33.
#
#  * The mock is the desktop package's, so a change to it (or to the models
#    package it imports) runs this workflow too.

name: Android – Unit Tests

on:
  push:
    branches: [main]
    paths:
      - 'clients/android/**'
      # The protocol manifest is shared: a change to it has to run this
      # suite too, or the drift check only fires for whoever edited last (#93).
      - 'protocol/**'
      # The instrumented suite runs against the desktop package's mock.
      - 'clients/apps/desktop/tests/mock/**'
      - 'clients/packages/models/**'
      - '.github/workflows/android-test.yml'
  pull_request:
    paths:
      - 'clients/android/**'
      # The protocol manifest is shared: a change to it has to run this
      # suite too, or the drift check only fires for whoever edited last (#93).
      - 'protocol/**'
      # The instrumented suite runs against the desktop package's mock.
      - 'clients/apps/desktop/tests/mock/**'
      - 'clients/packages/models/**'
      - '.github/workflows/android-test.yml'
  workflow_dispatch:

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric runtimes
        # Robolectric fetches its Android runtime jars into the Maven local
        # repository, which the Gradle cache does not cover.
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('clients/android/app/build.gradle.kts') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew :app:testDevDebugUnitTest --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: |
            clients/android/app/build/reports/tests/testDevDebugUnitTest/
            clients/android/app/build/test-results/testDevDebugUnitTest/
          retention-days: 7

  instrumented:
    name: Instrumented end-to-end (emulator + mock backend)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/package-lock.json

      - name: Install the TypeScript workspace
        # The mock lives in the desktop package; dependencies install at clients/.
        working-directory: clients
        run: npm ci

      - name: Start one mock backend per scenario
        working-directory: clients/apps/desktop
        run: |
          npm run -s mock:backend:build
          port=15597
          for scenario in default tool-call sub-agent handoff thinking slow no-model no-persona; do
            nohup node dist-mock/cli.js --host 0.0.0.0 --port "$port" --scenario "$scenario" \
              > "$RUNNER_TEMP/mock-$scenario.log" 2>&1 &
            port=$((port + 1))
          done
          for port in $(seq 15597 15604); do
            for _ in $(seq 1 30); do
              curl -sf "http://127.0.0.1:$port/version" > /dev/null && break
              sleep 1
            done
            curl -sf "http://127.0.0.1:$port/version" > /dev/null || { echo "mock on $port did not start"; exit 1; }
          done

      - name: Cache the emulator image
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64

      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "snapshot created"

      - name: Run the instrumented suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: clients/android
          # A software-rendered emulator can report "System UI isn't responding";
          # the dialog takes the focus and the screen from the app under test.
          script: |
            adb shell settings put global hide_error_dialogs 1
            ./gradlew :app:connectedDevDebugAndroidTest --no-configuration-cache --stacktrace || { adb pull /sdcard/Download "$RUNNER_TEMP/device" || true; exit 1; }

      - name: Upload reports and mock logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-report
          path: |
            clients/android/app/build/reports/androidTests/connected/
            clients/android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/mock-*.log
            ${{ runner.temp }}/device/
          retention-days: 7
