name: Desktop – Build and Release

# Release flow for the desktop client:
#
#   git tag desktop-v1.2.3 && git push origin desktop-v1.2.3
#
# Builds the Windows (NSIS) and Linux (AppImage, deb) packages and publishes
# them, with latest.yml / latest-linux.yml, as the release `desktop-v1.2.3` on
# this repository (#229). Installed apps' electron-updater reads this
# repository's `releases/latest` ("build.publish" in
# clients/apps/desktop/package.json) and fetches the update files under that
# release's tag, so the tag need not be semver — the version is in latest.yml.
# `releases/latest` is the newest release that is not a pre-release, which is
# why the Android workflow marks its releases pre-releases: this slot is the
# desktop's.
#
# No secret is needed: the workflow's own token creates the release here.
#
# A manual run (workflow_dispatch) builds without publishing and uploads the
# packages as a workflow artifact.

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write   # the release is created here

defaults:
  run:
    working-directory: clients/apps/desktop

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/package-lock.json

      - name: Install dependencies
        # The workspace root owns the lockfile and every member's dependencies
        # hoist into it, so this is the only directory `npm ci` can run in.
        working-directory: clients
        run: npm ci
        env:
          # @vscode/ripgrep downloads a prebuilt binary from the GitHub API in a
          # postinstall hook. Unauthenticated calls are rate-limited per runner
          # IP, so this intermittently fails the whole job with a 403 before any
          # test runs. The token raises the limit; it needs no extra scope.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^desktop-v', ''
          npm version $version --no-git-tag-version
          "version=$version" >> $env:GITHUB_OUTPUT

      # electron-builder writes latest.yml next to the installer whenever
      # "build.publish" is configured; uploading is a separate step so the
      # release is created by the workflow's own token, not a PAT.
      - name: Build Electron app
        run: npx vite build && npx electron-builder --publish never

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Desktop v${{ steps.version.outputs.version }}
          files: |
            clients/apps/desktop/release/*.exe
            clients/apps/desktop/release/*.exe.blockmap
            clients/apps/desktop/release/latest.yml

      - name: Upload packages (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            clients/apps/desktop/release/*.exe
            clients/apps/desktop/release/*.yml
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/package-lock.json

      - name: Install dependencies
        # The workspace root owns the lockfile and every member's dependencies
        # hoist into it, so this is the only directory `npm ci` can run in.
        working-directory: clients
        run: npm ci
        env:
          # @vscode/ripgrep downloads a prebuilt binary from the GitHub API in a
          # postinstall hook. Unauthenticated calls are rate-limited per runner
          # IP, so this intermittently fails the whole job with a 403 before any
          # test runs. The token raises the limit; it needs no extra scope.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          npm version "$version" --no-git-tag-version
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Electron app
        run: npx vite build && npx electron-builder --linux --publish never

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Desktop v${{ steps.version.outputs.version }}
          files: |
            clients/apps/desktop/release/*.AppImage
            clients/apps/desktop/release/*.deb
            clients/apps/desktop/release/latest-linux.yml

      - name: Upload packages (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            clients/apps/desktop/release/*.AppImage
            clients/apps/desktop/release/*.deb
            clients/apps/desktop/release/*.yml
          retention-days: 7
