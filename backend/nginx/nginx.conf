server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # These forwarded headers only reach the limiter if the API trusts this
    # container: set FORWARDED_ALLOW_IPS for the api service to this Compose
    # network's subnet, or the address below is the one every caller shares
    # (#155). See .env.template.

    # API
    location / {
        proxy_pass http://kurisu-api:15597;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx's default read timeout is 60s, which is shorter than a long
        # synthesis or a slow first token from a cold model. Only /ws had a
        # timeout of its own, so plain HTTP requests were being cut.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Kurisu Drive
    #
    # The 50M above is right for an avatar and wrong for a drive, so this
    # location carries its own ceiling. Keep it at or above the api service's
    # DRIVE_MAX_FILE_BYTES: whichever is smaller is the real limit, and an
    # upload nginx refuses never reaches the message the backend would have
    # given. `client_max_body_size 0` would remove the limit entirely — do not,
    # the backend's own ceiling is the one that reports a usable error.
    #
    # Buffering off is what makes the upload actually stream. By default nginx
    # spools the whole request body to its own disk before opening a connection
    # to the API, which turns an incremental write into a copy of the file plus
    # a wait, and defers every quota refusal until after the upload is paid for.
    location /drive/ {
        proxy_pass http://kurisu-api:15597;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 2g;
        proxy_request_buffering off;
        # A large upload or download over a slow link outlasts the 300s the API
        # location allows.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Character assets: the two streamed uploads (#236)
    #
    # A persona's VRM model (PUT …/vrm/model) and its clips (PUT …/vrma) stream
    # in like a drive file, and a model can be ~100 MB, so exactly those two
    # paths get the drive's treatment at their own size. Everything else under
    # /character-assets/ — the pose-graph uploads, which are read into memory —
    # keeps the server-wide 50M above. A regex location wins over the plain
    # prefix `location /`. 128M is deliberately above the api's
    # CHARACTER_MODEL_MAX_BYTES (100 MiB) so that the backend, not nginx, is the
    # one that refuses an oversized model — its 413 names the limit; nginx's is
    # an HTML page no client can read.
    location ~ ^/character-assets/[0-9]+/(vrm/model|vrma)$ {
        proxy_pass http://kurisu-api:15597;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 128M;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # A persona imported with its character (#248)
    #
    # A bundle holds the model, its clips and the pose art in one body, so it
    # streams in like the uploads above. It has no ceiling of its own (the
    # owner's call): the api bounds each file by its kind's ceiling and the
    # model and clips by the account's quota, and says which in a sentence.
    location = /personas/import/bundle {
        proxy_pass http://kurisu-api:15597;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket
    location /ws {
        proxy_pass http://kurisu-api:15597;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
