# Dev overlay for the backend — a second, isolated API + database on this box.
#
# For trying main against a running backend without touching a deployment. Run it
# from the backend/ of the checkout you want to run — never from a deployment's
# tree: the API bind-mounts ./kurisuassistant and ./data, so two projects sharing
# one directory would run the same code against the same files.
#
#   cp /path/to/deployment/backend/.env .   # same credentials, separate database
#   docker compose -f docker-compose.dev.yml up -d --build
#
# It is its own project (kurisuassistant-dev) with its own database and data/.
# See docs/development.md "Releases and Deployment".
#
# Duplicated for dev: the API (kurisu-api-dev), Postgres (postgres-dev, own
# volume, own alembic_version) and ./data (images, avatars, character assets,
# voice uploads, JWT secret). None of it is shared with production.
#
# Shared with production: the GPU services (universal-voice, vixtts,
# gpt-sovits), reached over production's compose network, and Ollama over
# `central`. They are stateless as far as the API is concerned — the API
# uploads the voice reference with every TTS request — so a second copy would
# only cost GPU memory.
#
# Publishes no port and is not part of any reverse-proxy setup. Reach this
# instance on the docker network, or add a `ports:` mapping here while you need it.

name: kurisuassistant-dev

services:
  api:
    extends:
      file: docker-compose.yml
      service: api
    # Container names are global on `central`, so it must differ from production's.
    container_name: kurisu-api-dev
    # !override replaces the inherited list: the GPU services belong to production.
    depends_on: !override
      - postgres-dev
    environment:
      # Never the bare `postgres`: this container also sits on production's
      # network, where that name resolves to the production database.
      - POSTGRES_HOST=postgres-dev
    networks:
      - default
      - central
      - kurisu-prod

  postgres-dev:
    extends:
      file: docker-compose.yml
      service: postgres
    container_name: postgres-dev

networks:
  default:
  central:
    external: true
    name: central
  # Production's project network, for universal-voice / vixtts / gpt-sovits.
  kurisu-prod:
    external: true
    name: kurisuassistant_default

volumes:
  # Becomes kurisuassistant-dev_postgres-data — separate from production's.
  postgres-data:
