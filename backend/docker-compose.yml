# The stack. `docker compose up -d` on a clean machine starts the API and its
# database, publishes the API on the host, and needs nothing that is not in this
# repository. There are two Compose files in the project: this one and
# `docker-compose.dev.yml`.
#
# The parts that need more than this directory — a GPU — are profiles, off
# unless you ask:
#
#   --profile whisper     speech recognition: a Whisper server (#212).
#   --profile gpt-sovits  synthesis, cloning from a reference clip.
#   --profile vixtts      synthesis, cloning or a preset XTTS speaker.
#   --profile tls         nginx on 443 with the bundled self-signed certificate.
#                         Run ./nginx/generate-certs.sh once first.
#
#   docker compose --profile whisper --profile gpt-sovits up -d
#
# Every speech engine is a published image this stack pulls; none is built here
# and none of their code is in this repository (#212). Every synthesis engine
# speaks one contract (docs/speech-engine-contract.md), so the API is told only
# a name and an address per engine — TTS_ENGINES — and an engine you already
# run elsewhere is one more entry, no profile needed. Each engine manages its
# own GPU memory: it drops its weights when idle and when asked, and says so
# when it cannot load them (#227).
#
# Without any profile the API runs on CPU and answers over HTTP on API_PORT;
# speech stays unavailable until an engine is started or an address is set.
# That is a working install, not a broken one.
#
# Anything specific to one machine — a GPU reservation for the vision pipeline,
# an existing reverse-proxy network — goes in an untracked
# `docker-compose.override.yml`, which Compose loads automatically. See
# docs/development.md for a worked example.

# Fixed so a deployment adopts the same containers and volumes from any directory.
# Without it the project is named after the directory, and a checkout under a new
# path would silently create an empty database instead of using this one.
name: kurisuassistant

services:
  whisper:
    profiles: ["whisper"]
    # Recognition. A published image (#212): one model per container, named by
    # ASR_MODEL, on the faster-whisper engine. It unloads the model itself after
    # MODEL_IDLE_TIMEOUT, which is the only residency there is now that no
    # engine runs in a process this project controls.
    image: onerahmet/openai-whisper-asr-webservice:v1.10.0-gpu
    container_name: kurisu-whisper
    environment:
      - ASR_ENGINE=faster_whisper
      - ASR_MODEL=${ASR_MODEL:-base}
      - ASR_DEVICE=${ASR_DEVICE:-cuda}
      # Seconds; 0 keeps the model resident for ever.
      - MODEL_IDLE_TIMEOUT=${ASR_IDLE_TIMEOUT:-300}
    volumes:
      # The weights, downloaded on first use. Re-downloadable; not a backup.
      - whisper-cache:/root/.cache
    expose:
      - "9000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - default
    restart: unless-stopped

  gpt-sovits:
    profiles: ["gpt-sovits"]
    # Synthesis. The owner's fork, `kurisu` target: kurisu_engine.py hosts api_v2
    # as a child and speaks the contract in front of it (#227). Pinned by tag,
    # dated at build; `latest` is what made this stack unreproducible before.
    image: legwork7623/gpt-sovits:kurisu-20260919
    container_name: kurisu-gpt-sovits
    environment:
      - is_half=True
      - is_share=False
      # Seconds without a request before the engine ends its model process and
      # gives the card back; 0 keeps it resident. The next request restarts it
      # (about 50s to first audio). The language assumed when a request names none.
      - IDLE_TIMEOUT=${TTS_IDLE_TIMEOUT:-600}
      - DEFAULT_LANGUAGE=${GPTSOVITS_DEFAULT_LANGUAGE:-ja}
    volumes:
      - gpt-sovits-weights:/workspace/SoVITS_weights
    working_dir: /workspace
    expose:
      - "9880"
    shm_size: 16G
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stdin_open: true
    tty: true
    networks:
      - default
    restart: unless-stopped

  vixtts:
    profiles: ["vixtts"]
    # Synthesis: the owner's viXTTS server, which speaks the contract natively
    # (#227). Published for the first time with it, so a fresh install can pull it.
    image: legwork7623/vixtts:kurisu-20260919
    container_name: kurisu-vixtts
    environment:
      - IDLE_TIMEOUT=${TTS_IDLE_TIMEOUT:-600}
    volumes:
      - vixtts-models:/models
      - vixtts-hf-cache:/root/.cache/huggingface
    expose:
      - "19770"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - default
    restart: unless-stopped

  api:
    # Logs are capped: the default json-file driver grows without limit, and
    # this service logs every request at INFO for the life of the deployment.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kurisu-api
    # Only the database. The speech services are called over HTTP per request,
    # so the API starts and serves text without them — and naming a profiled
    # service here would make the whole project invalid whenever that profile
    # is off.
    depends_on:
      postgres:
        condition: service_healthy
    # Published, not merely exposed. `expose` alone put the API on the Compose
    # network only, so a fresh install came up with no way for any client to
    # reach it; the machine this was written on reached it through a separate
    # reverse proxy on an external network. With --profile tls, or any other
    # proxy in front, set API_BIND=127.0.0.1 to keep this port off the network.
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-15597}:15597"
    networks:
      - default
    environment:
      # Where each speech engine is (#212). An address that is not set means
      # that engine is not part of this deployment: a request for it is refused
      # with a sentence naming what to start, never a silent empty list.
      - ASR_URL=${ASR_URL:-http://kurisu-whisper:9000}
      - LLM_API_URL=${LLM_API_URL:-http://host.docker.internal:11434}
      # The synthesis engines, name=address pairs: the names are the model ids
      # the clients store, and every engine speaks the same contract, so this
      # is all the API knows about them (#227). Add `,vixtts=http://kurisu-vixtts:19770`
      # with `--profile vixtts`, or any engine you run elsewhere.
      - TTS_ENGINES=${TTS_ENGINES:-gpt-sovits=http://kurisu-gpt-sovits:9880}
      # Which synthesis engine serves a request that names none.
      - TTS_DEFAULT_MODEL=${TTS_DEFAULT_MODEL:-gpt-sovits}
      # What the recognition engine was started with, so the model picker can
      # name it. The same variable the whisper service reads, so the two cannot
      # drift: a container serves one model and this is what it is called.
      - ASR_MODEL=${ASR_MODEL:-base}
      # Server-wide fallbacks for users with no key of their own stored; empty
      # disables the fallback. See the environment template.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - POE_API_KEY=${POE_API_KEY:-}
      # Everything below was documented as configurable and reached nothing:
      # the template offered these knobs, the container never received them, so
      # the server ran on its built-in defaults whatever the operator wrote.
      # TLS verification is the one that matters most.
      - MCP_TLS_VERIFY=${MCP_TLS_VERIFY:-true}
      - AUTH_RATE_LIMIT_MAX_ATTEMPTS=${AUTH_RATE_LIMIT_MAX_ATTEMPTS:-10}
      - AUTH_RATE_LIMIT_WINDOW_SECONDS=${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}
      # The second bucket, keyed on the username a proxy cannot rewrite (#155).
      - AUTH_RATE_LIMIT_MAX_ATTEMPTS_PER_USER=${AUTH_RATE_LIMIT_MAX_ATTEMPTS_PER_USER:-20}
      # Which peers' X-Forwarded-For to believe. Empty means none, so the
      # per-address limit keys on the socket peer — correct when nothing is in
      # front, wrong behind a proxy. With the tls profile the proxy is the
      # bundled nginx on this Compose network.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      - CONVERSATION_IDLE_THRESHOLD_MINUTES=${CONVERSATION_IDLE_THRESHOLD_MINUTES:-30}
      - MAX_IMAGE_BYTES=${MAX_IMAGE_BYTES:-16777216}
      # Kurisu Drive. The quota is per account and registration is open by
      # default, so an unmetered drive is a disk-exhaustion surface for the
      # whole host. Raising the file ceiling past nginx's client_max_body_size
      # only helps when nothing is proxying (see nginx/nginx.conf).
      - DRIVE_QUOTA_BYTES=${DRIVE_QUOTA_BYTES:-16106127360}
      - DRIVE_MAX_FILE_BYTES=${DRIVE_MAX_FILE_BYTES:-2147483648}
      # A persona's 3D character (#236): one VRM model and its VRMA clips per
      # persona, metered per account across personas (pose art is not). Same
      # disk-exhaustion reasoning as the drive; keep the model ceiling under the
      # 128M nginx/nginx.conf allows on the two streamed upload paths.
      - CHARACTER_MODEL_MAX_BYTES=${CHARACTER_MODEL_MAX_BYTES:-104857600}
      - CHARACTER_CLIP_MAX_BYTES=${CHARACTER_CLIP_MAX_BYTES:-16777216}
      - CHARACTER_ASSETS_QUOTA_BYTES=${CHARACTER_ASSETS_QUOTA_BYTES:-1073741824}
      # The largest description (JSON chunk) a model may carry, parsed off the
      # event loop; and what the three pose-graph routes read into memory.
      - CHARACTER_MODEL_JSON_MAX_BYTES=${CHARACTER_MODEL_JSON_MAX_BYTES:-16777216}
      - CHARACTER_IMAGE_MAX_BYTES=${CHARACTER_IMAGE_MAX_BYTES:-16777216}
      - CHARACTER_VIDEO_MAX_BYTES=${CHARACTER_VIDEO_MAX_BYTES:-33554432}
      # Recall (#6). One embedding model for the whole index, so it is the
      # operator's choice, not the user's: ollama (via LLM_API_URL), gemini or
      # nvidia (via the keys above). Empty EMBEDDING_MODEL switches semantic
      # recall off; recall by pattern keeps working. Files over the byte cap,
      # and passages past the per-file cap, are not indexed.
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-ollama}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3}
      - RETRIEVAL_MAX_FILE_BYTES=${RETRIEVAL_MAX_FILE_BYTES:-20971520}
      - RETRIEVAL_MAX_PASSAGES_PER_FILE=${RETRIEVAL_MAX_PASSAGES_PER_FILE:-2000}
      # How long the entrypoint waits for the database before failing loudly.
      - DB_WAIT_ATTEMPTS=${DB_WAIT_ATTEMPTS:-60}
      - DB_WAIT_INTERVAL=${DB_WAIT_INTERVAL:-2}
      # Ceilings that keep a stuck database from silently hanging every request
      # (#153): TCP connect, one statement, and how long a request waits for the
      # single database thread. 0 disables the statement timeout.
      - DB_CONNECT_TIMEOUT_SECONDS=${DB_CONNECT_TIMEOUT_SECONDS:-5}
      - DB_STATEMENT_TIMEOUT_SECONDS=${DB_STATEMENT_TIMEOUT_SECONDS:-30}
      - DB_OPERATION_TIMEOUT_SECONDS=${DB_OPERATION_TIMEOUT_SECONDS:-60}
      # Where YOLOv8-Pose runs for gesture detection: cpu, cuda, or empty to
      # use a GPU when torch can see one (#152). The base stack reserves no GPU;
      # docs/development.md shows the override that does.
      - VISION_DEVICE=${VISION_DEVICE:-}
      # No silent defaults on the credentials: an empty environment file used to
      # start Postgres with a blank password and an API that could not log into
      # it, which reads as a hang rather than as a configuration error.
      - POSTGRES_USER=${POSTGRES_USER:?copy the environment template and set the database credentials}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?copy the environment template and set the database credentials}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres-container}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-kurisu}
    extra_hosts:
      # Makes the default LLM_API_URL reach an Ollama running on the host, which
      # is where most people already have one. Docker Desktop provides this name
      # natively; on Linux this line is what creates it.
      - "host.docker.internal:host-gateway"
    volumes:
      # Runtime state only. The code comes from the image (see Dockerfile), so
      # this checkout is a build context and nothing more — a `git checkout`
      # here does not touch the running server, and the image can run on a host
      # that has no checkout at all. The dev overlay mounts the source back.
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:15597/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Migrations run before the server binds, so give them room.
      start_period: 120s
    tty: true
    restart: unless-stopped

  postgres:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    image: pgvector/pgvector:pg16
    container_name: postgres-container
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?copy the environment template and set the database credentials}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?copy the environment template and set the database credentials}
      - POSTGRES_DB=${POSTGRES_DB:-kurisu}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # The API waits on this condition, so "healthy" has to mean "accepting
    # queries" — not merely "the container started", which is all a bare
    # depends_on promised. The entrypoint's retry loop is no longer the only
    # thing between a cold start and a crash loop.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - default
    restart: unless-stopped

  nginx:
    profiles: ["tls"]
    image: nginx:alpine
    container_name: kurisu-nginx
    depends_on:
      api:
        condition: service_started
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default
    restart: unless-stopped

networks:
  default:

volumes:
  postgres-data:
  whisper-cache:
  gpt-sovits-weights:
  vixtts-models:
  vixtts-hf-cache:
